[project]
name = "usiquimica-planejamento"
version = "0.1.0"
description = "App de planejamento integrado Usiquímica: demanda, consenso S&OP, MPS, MRP e execução"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planejamento*"]
